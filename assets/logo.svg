<svg width="112" height="112" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cloudflare Vibrant Brand Gradient -->
    <linearGradient id="hex-fill" x1="16" y1="8" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="55%" stop-color="#F38020"/>
      <stop offset="100%" stop-color="#D93B18"/>
    </linearGradient>

    <!-- Glass Highlight Border for Hexagon -->
    <linearGradient id="hex-border" x1="16" y1="8" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- 3D Cloud Volume Gradient -->
    <linearGradient id="cloud-fill" x1="56" y1="36" x2="56" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4F7FA"/>
      <stop offset="100%" stop-color="#E1E8F0"/>
    </linearGradient>

    <!-- Glassmorphic Wing Gradient -->
    <linearGradient id="wing-fill" x1="45" y1="20" x2="65" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Badge Ambient Shadow (Native vector path for 100% renderer compatibility) -->
  <path d="M 51.68 11.53 
           L 92.68 35.53 
           A 6 6 0 0 1 95.68 40.72 
           L 95.68 77.28 
           A 6 6 0 0 1 92.68 82.47 
           L 60.32 101.34 
           A 6 6 0 0 1 51.68 101.34 
           L 19.32 82.47 
           A 6 6 0 0 1 16.32 77.28 
           L 16.32 40.72 
           A 6 6 0 0 1 19.32 35.53 
           L 51.68 11.53 Z" 
        fill="#0B0F19" 
        opacity="0.25"/>

  <!-- Main Rounded Hexagon Outer Badge -->
  <path d="M 51.68 8.53 
           L 92.68 32.53 
           A 6 6 0 0 1 95.68 37.72 
           L 95.68 74.28 
           A 6 6 0 0 1 92.68 79.47 
           L 60.32 98.34 
           A 6 6 0 0 1 51.68 98.34 
           L 19.32 79.47 
           A 6 6 0 0 1 16.32 74.28 
           L 16.32 37.72 
           A 6 6 0 0 1 19.32 32.53 
           L 51.68 8.53 Z" 
        fill="url(#hex-fill)"/>

  <!-- Hexagon Inner Bevel/Border Highlight -->
  <path d="M 51.68 8.53 
           L 92.68 32.53 
           A 6 6 0 0 1 95.68 37.72 
           L 95.68 74.28 
           A 6 6 0 0 1 92.68 79.47 
           L 60.32 98.34 
           A 6 6 0 0 1 51.68 98.34 
           L 19.32 79.47 
           A 6 6 0 0 1 16.32 74.28 
           L 16.32 37.72 
           A 6 6 0 0 1 19.32 32.53 
           L 51.68 8.53 Z" 
        stroke="url(#hex-border)" 
        stroke-width="1.25" 
        fill="none"/>

  <!-- AI Sparkles in background of badge -->
  <path d="M 82 22 Q 82 25 85 25 Q 82 25 82 28 Q 82 25 79 25 Q 82 25 82 22 Z" fill="#FFF2D6" opacity="0.95"/>
  <path d="M 27 76 Q 27 78 29 78 Q 27 78 27 80 Q 27 78 25 78 Q 27 78 27 76 Z" fill="#FFF2D6" opacity="0.6"/>

  <!-- Back Wing -->
  <path d="M 44 42 C 34 30 46 22 55 34 Z" fill="url(#wing-fill)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.9"/>
  <!-- Front Wing -->
  <path d="M 55 40 C 53 25 68 22 67 36 Z" fill="url(#wing-fill)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.9"/>

  <!-- Antennae (Stems & Signal Nodes) -->
  <path d="M 47 43 C 44 34 38 33 36 35" stroke="#121324" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="35.5" cy="35" r="4" fill="#FFC700" opacity="0.35"/>
  <circle cx="35.5" cy="35" r="2.5" fill="#FFC700"/>

  <path d="M 64 41 C 67 32 73 31 75 33" stroke="#121324" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="75.5" cy="33" r="4" fill="#FFC700" opacity="0.35"/>
  <circle cx="75.5" cy="33" r="2.5" fill="#FFC700"/>

  <!-- Native Cloud Drop Shadow Path (Guarantees depth in GitHub README / sanitized SVGs) -->
  <path d="M 34 71 
           C 26 71 23 61 31 55 
           C 29 45 41 40 49 45 
           C 54 38 68 39 73 47 
           C 81 46 86 55 81 63 
           C 85 71 76 77 68 74 
           C 62 78 42 78 34 71 Z" 
        fill="#8B1D00" 
        opacity="0.3"/>

  <!-- Main Cloud Body Silhouette (Bee Shape) -->
  <path d="M 34 68 
           C 26 68 23 58 31 52 
           C 29 42 41 37 49 42 
           C 54 35 68 36 73 44 
           C 81 43 86 52 81 60 
           C 85 68 76 74 68 71 
           C 62 75 42 75 34 68 Z" 
        fill="url(#cloud-fill)"/>

  <!-- Bee Body Stripes (Curved to follow 3D cloud shape) -->
  <g fill="#121324">
    <!-- Top Stripe -->
    <path d="M 43 51 C 51 48 60 49 67 52 C 65 55.5 53 53.5 43 54.5 Z"/>
    <!-- Middle Stripe -->
    <path d="M 40 58 C 50 55.5 63 56.5 71 60.5 C 69 64 54 62 40 61 Z"/>
    <!-- Bottom Stripe -->
    <path d="M 44 65 C 52 63.5 61 64.5 67 66.5 C 65 69 53 68 44 67.5 Z"/>

    <!-- Bee Stinger -->
    <path d="M 28 62 L 22 64 L 27 67 Z"/>
  </g>

  <!-- Expressive AI Bee Eye -->
  <g>
    <!-- Outer Eye -->
    <ellipse cx="61.5" cy="47.5" rx="4.2" ry="5.5" fill="#121324"/>
    <!-- Primary Catchlight / Reflection -->
    <circle cx="63" cy="46" r="1.8" fill="#FFFFFF"/>
    <!-- Secondary Catchlight -->
    <circle cx="60.2" cy="49.5" r="0.8" fill="#FFFFFF"/>
    <!-- Cute Blush Accent -->
    <ellipse cx="67.5" cy="53.5" rx="2.5" ry="1.5" fill="#FF7070" opacity="0.45"/>
  </g>
</svg>


